name: HKID quota monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hkid-quota-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check quota
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TARGET_START: ${{ vars.TARGET_START }}
          TARGET_END: ${{ vars.TARGET_END }}
          OFFICES: ${{ vars.OFFICES }}
          BOOKING_URL: ${{ vars.BOOKING_URL }}
        run: python monitor.py

      - name: Persist state/history when changed
        run: |
          git config user.name "hkid-quota-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A .data
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update quota state [skip ci]"
            git push
          fi
